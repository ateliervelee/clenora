<section id="quotes" class="quotes section">
    <div class="container">
        <h2 class="quotes-title">{{quotes_title}}</h2>
        <p class="quotes-subtitle">{{quotes_subtitle}}</p>

        <div class="quotes-folder">
            <div class="quotes-tabs" role="tablist" aria-label="{{quotes_title}}">
                <button type="button" role="tab" class="quotes-tab quotes-tab--1 is-active" data-quote="home" id="quotes-tab-home" aria-selected="true" aria-controls="quotes-panel-home">
                    <span class="quotes-tab-label">{{quotes_tab_home}}</span>
                </button>
                <button type="button" role="tab" class="quotes-tab quotes-tab--2" data-quote="apartments" id="quotes-tab-apartments" aria-selected="false" aria-controls="quotes-panel-apartments">
                    <span class="quotes-tab-label">{{quotes_tab_apartments}}</span>
                </button>
                <button type="button" role="tab" class="quotes-tab quotes-tab--3" data-quote="villas" id="quotes-tab-villas" aria-selected="false" aria-controls="quotes-panel-villas">
                    <span class="quotes-tab-label">{{quotes_tab_villas}}</span>
                </button>
                <button type="button" role="tab" class="quotes-tab quotes-tab--4" data-quote="offices" id="quotes-tab-offices" aria-selected="false" aria-controls="quotes-panel-offices">
                    <span class="quotes-tab-label">{{quotes_tab_offices}}</span>
                </button>
                <button type="button" role="tab" class="quotes-tab quotes-tab--5" data-quote="stairwell" id="quotes-tab-stairwell" aria-selected="false" aria-controls="quotes-panel-stairwell">
                    <span class="quotes-tab-label">{{quotes_tab_stairwell}}</span>
                </button>
            </div>

            <div class="quotes-panel-wrap">
                <div class="quotes-panel quotes-panel--1 is-active" id="quotes-panel-home" role="tabpanel" aria-labelledby="quotes-tab-home" data-quote="home"></div>
                <div class="quotes-panel quotes-panel--2" id="quotes-panel-apartments" role="tabpanel" aria-labelledby="quotes-tab-apartments" hidden data-quote="apartments"></div>
                <div class="quotes-panel quotes-panel--3" id="quotes-panel-villas" role="tabpanel" aria-labelledby="quotes-tab-villas" hidden data-quote="villas"></div>
                <div class="quotes-panel quotes-panel--4" id="quotes-panel-offices" role="tabpanel" aria-labelledby="quotes-tab-offices" hidden data-quote="offices"></div>
                <div class="quotes-panel quotes-panel--5" id="quotes-panel-stairwell" role="tabpanel" aria-labelledby="quotes-tab-stairwell" hidden data-quote="stairwell"></div>
            </div>
        </div>
    </div>
</section>

<style>
.quotes {
    background-color: var(--color-grey-light);
    padding-bottom: var(--spacing-2xl);
}

.quotes-title {
    text-align: center;
    color: var(--color-text);
    margin-bottom: var(--spacing-sm);
    font-size: var(--font-size-3xl);
}

.quotes-subtitle {
    text-align: center;
    color: var(--color-text-light);
    font-size: var(--font-size-lg);
    max-width: 560px;
    margin: 0 auto var(--spacing-lg);
}

.quotes-folder {
    max-width: 900px;
    margin: 0 auto;
}

/* Shared pastel backgrounds (tabs + active panel) */
.quotes-tab--1, .quotes-panel--1.is-active { --quote-surface: linear-gradient(180deg, #ffd6e8 0%, #ffc4df 100%); }
.quotes-tab--2, .quotes-panel--2.is-active { --quote-surface: linear-gradient(180deg, #fff3bf 0%, #ffe98a 100%); }
.quotes-tab--3, .quotes-panel--3.is-active { --quote-surface: linear-gradient(180deg, #c8e4ff 0%, #a8d4ff 100%); }
.quotes-tab--4, .quotes-panel--4.is-active { --quote-surface: linear-gradient(180deg, #ffe4ef 0%, #ffcce0 100%); }
.quotes-tab--5, .quotes-panel--5.is-active { --quote-surface: linear-gradient(180deg, #e0f0ff 0%, #c5e2ff 100%); }

.quotes-tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 0;
    position: relative;
    z-index: 2;
    min-height: 78px;
    padding: 0 4px;
}

.quotes-tab {
    position: relative;
    flex: 1 1 0;
    min-width: 72px;
    max-width: 180px;
    margin: 0 -6px;
    padding: 0 12px 10px;
    border: none;
    border-radius: 12px 12px 0 0;
    cursor: pointer;
    font-family: var(--font-family);
    font-weight: 600;
    font-size: var(--font-size-sm);
    color: var(--color-text);
    background: var(--quote-surface);
    box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
    transition: transform 0.25s ease, box-shadow 0.25s ease, min-height 0.25s ease, padding 0.25s ease, z-index 0s linear 0.25s;
    /* Collapsed: 50% taller than previous 22px → 33px */
    min-height: 33px;
    max-height: 33px;
    overflow: hidden;
    z-index: 1;
    opacity: 0.92;
}

.quotes-tab:hover {
    opacity: 1;
    z-index: 3;
}

.quotes-tab.is-active {
    /* Extended: 25% taller than previous 48px → 60px */
    min-height: 60px;
    max-height: none;
    padding: 12px 14px 14px;
    z-index: 10;
    opacity: 1;
    transform: translateY(0);
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.1);
}

.quotes-tab-label {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.quotes-panel-wrap {
    position: relative;
    z-index: 1;
    margin-top: -1px;
}

.quotes-panel {
    min-height: 200px;
    padding: var(--spacing-lg);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    box-shadow: var(--shadow-md);
    border: 3px solid transparent;
    border-top: none;
}

.quotes-panel.is-active {
    display: block;
    background: var(--quote-surface);
    border-color: rgba(255, 255, 255, 0.5);
}

.quotes-panel:not(.is-active) {
    display: none;
}

.quote-content {
    color: var(--color-text);
    font-size: var(--font-size-base);
    line-height: 1.6;
}

.quote-heading {
    margin: 0 0 var(--spacing-md);
    font-size: var(--font-size-xl);
    font-weight: 700;
    color: var(--color-text);
}

.quote-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.quote-table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--font-size-base);
}

.quote-table th,
.quote-table td {
    padding: 0.6rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    vertical-align: top;
}

.quote-table thead th {
    font-weight: 600;
    color: var(--color-text);
    border-bottom-width: 2px;
}

.quote-extras,
.quote-list {
    margin: var(--spacing-md) 0 0;
    padding-left: 1.35rem;
}

.quote-extras li,
.quote-list li {
    margin-bottom: 0.4rem;
}

.quote-note {
    margin: var(--spacing-md) 0 0;
    line-height: 1.5;
}

@media (max-width: 768px) {
    .quotes-tab {
        min-width: 56px;
        font-size: var(--font-size-sm);
        margin: 0 -4px;
        padding: 0 6px 8px;
        min-height: 33px;
        max-height: 33px;
    }
    .quotes-tab.is-active {
        min-height: 55px;
        padding: 10px 8px 12px;
    }
    .quotes-tabs {
        min-height: 70px;
    }
}
</style>

<script>
(function() {
    /** Reorder: change order of buttons, panels, and this array together. */
    var QUOTE_ITEMS = [
        { id: 'home', path: 'components/quotes/quote-home.html' },
        { id: 'apartments', path: 'components/quotes/quote-apartments.html' },
        { id: 'villas', path: 'components/quotes/quote-villas.html' },
        { id: 'offices', path: 'components/quotes/quote-offices.html' },
        { id: 'stairwell', path: 'components/quotes/quote-stairwell.html' }
    ];

    function injectQuote(html, id) {
        var panel = document.getElementById('quotes-panel-' + id);
        if (!panel) return;
        var processed = typeof replacePlaceholders === 'function' ? replacePlaceholders(html) : html;
        panel.innerHTML = processed;
    }

    function setActive(quoteId) {
        document.querySelectorAll('.quotes-tab').forEach(function(tab) {
            var active = tab.getAttribute('data-quote') === quoteId;
            tab.classList.toggle('is-active', active);
            tab.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        document.querySelectorAll('.quotes-panel').forEach(function(panel) {
            var active = panel.getAttribute('data-quote') === quoteId;
            panel.classList.toggle('is-active', active);
            if (active) {
                panel.removeAttribute('hidden');
            } else {
                panel.setAttribute('hidden', '');
            }
        });
    }

    function loadQuotes() {
        QUOTE_ITEMS.forEach(function(q) {
            fetch(q.path)
                .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
                .then(function(html) { injectQuote(html, q.id); })
                .catch(function() {
                    var el = document.getElementById('quotes-panel-' + q.id);
                    if (el) el.innerHTML = '<div class="quote-content"></div>';
                });
        });
    }

    document.querySelectorAll('.quotes-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            setActive(tab.getAttribute('data-quote'));
        });
    });

    setActive('home');
    loadQuotes();
})();
</script>
