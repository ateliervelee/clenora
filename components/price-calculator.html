<section id="price-calculator" class="price-calculator section">
    <div class="container">
        <h2 class="price-calculator-title">{{calc_title}}</h2>
        <p class="price-calculator-subtitle">{{calc_subtitle}}</p>

        <div class="price-calculator-card">
            <p class="price-calculator-info">{{calc_info}}</p>

            <div class="price-calculator-fields">
                <div class="form-group">
                    <label for="calc-m2" class="form-label">{{calc_m2_label}}</label>
                    <input type="number" id="calc-m2" class="form-input calc-m2-input" min="1" step="1" value="50" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="calc-hours-display" class="form-label">{{calc_hours_label}}</label>
                    <input type="text" id="calc-hours-display" class="form-input calc-readonly" readonly tabindex="-1" aria-live="polite">
                </div>

                <div class="form-group">
                    <label for="calc-price-display" class="form-label">{{calc_price_label}}</label>
                    <input type="text" id="calc-price-display" class="form-input calc-readonly calc-price-highlight" readonly tabindex="-1" aria-live="polite">
                </div>
            </div>

            <p class="price-calculator-disclaimer">{{calc_disclaimer}}</p>
        </div>
    </div>
</section>

<style>
.price-calculator {
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
    color: var(--color-white);
}

.price-calculator-title {
    text-align: center;
    color: var(--color-white);
    margin-bottom: var(--spacing-sm);
    font-size: var(--font-size-3xl);
}

.price-calculator-subtitle {
    text-align: center;
    color: rgba(255, 255, 255, 0.92);
    font-size: var(--font-size-lg);
    max-width: 560px;
    margin: 0 auto var(--spacing-lg);
}

.price-calculator-card {
    max-width: 480px;
    margin: 0 auto;
    background: var(--color-white);
    border-radius: var(--radius-lg);
    padding: var(--spacing-lg);
    box-shadow: var(--shadow-lg);
}

.price-calculator-info {
    font-size: var(--font-size-sm);
    color: var(--color-text-light);
    line-height: 1.6;
    margin-bottom: var(--spacing-md);
    padding-bottom: var(--spacing-md);
    border-bottom: 1px solid var(--color-grey-medium);
}

.price-calculator-fields .form-label {
    color: var(--color-text);
}

.price-calculator-fields .form-input {
    color: var(--color-text);
}

.calc-readonly {
    background-color: var(--color-grey-light);
    cursor: default;
}

.calc-price-highlight {
    font-weight: 700;
    font-size: var(--font-size-xl);
    color: var(--color-primary-dark);
}

.price-calculator-disclaimer {
    font-size: var(--font-size-sm);
    color: var(--color-text-light);
    margin: var(--spacing-md) 0 0;
    font-style: italic;
}

@media (max-width: 768px) {
    .price-calculator-title {
        font-size: var(--font-size-2xl);
    }
}
</style>

<script>
(function() {
    var M2_PER_HOUR = 17;
    var EUR_PER_HOUR = 15;
    var MIN_PRICE_EUR = 30;

    function updateCalculator() {
        var m2Input = document.getElementById('calc-m2');
        var hoursOut = document.getElementById('calc-hours-display');
        var priceOut = document.getElementById('calc-price-display');
        if (!m2Input || !hoursOut || !priceOut) return;

        var m2 = parseFloat(m2Input.value, 10);
        if (isNaN(m2) || m2 < 1) {
            hoursOut.value = '—';
            priceOut.value = '—';
            return;
        }
        var hours = Math.ceil(m2 / M2_PER_HOUR);
        var price = Math.max(hours * EUR_PER_HOUR, MIN_PRICE_EUR);
        hoursOut.value = hours + ' h';
        priceOut.value = price + ' €';
    }

    // Runs when component is injected (DOMContentLoaded may have already fired)
    var m2Input = document.getElementById('calc-m2');
    if (m2Input) {
        m2Input.addEventListener('input', updateCalculator);
        m2Input.addEventListener('change', updateCalculator);
        updateCalculator();
    }
})();
</script>
