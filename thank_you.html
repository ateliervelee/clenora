<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hvala što ste kontaktirali Clenoru - Profesionalno čišćenje stanova.">
    <title>Hvala vam - Clenora</title>
    <link rel="icon" type="image/x-icon" href="images/flavicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="images/flavicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/flavicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/flavicon/apple-touch-icon.png">
    <link rel="manifest" href="images/flavicon/site.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Components will be injected here -->
    <div id="header-container"></div>
    
    <main>
        <div class="container">
            <div class="thank-you-card">
                <div class="thank-you-icon">✓</div>
                <h1>{{thankyou_title}}</h1>
                <p>{{thankyou_message_lead}}<span class="highlight">{{thankyou_highlight}}</span>{{thankyou_message_tail}}</p>
                
                <div class="response-info">
                    <h3>{{thankyou_next_title}}</h3>
                    <p>{{thankyou_next_desc}}</p>
                </div>

                <p>{{thankyou_meanwhile}}</p>

                <div class="action-buttons">
                    <a href="index.html" class="btn btn-primary">{{thankyou_back_home}}</a>
                    <a href="index.html#contact" class="btn btn-secondary">{{thankyou_another_message}}</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be loaded here -->
    <div id="footer-container"></div>
    <div id="whatsapp-float-container"></div>

    <!-- Locale: strings.js = English, strings-hr.js = Croatian -->
    <script src="strings-hr.js"></script>
    <script src="script.js"></script>
    <script>
        // Load header and footer components, then replace placeholders in static content
        document.addEventListener('DOMContentLoaded', async () => {
            const loadComponent = async (containerId, componentPath) => {
                try {
                    const response = await fetch(componentPath);
                    if (!response.ok) throw new Error(`Failed to load: ${componentPath}`);
                    let html = await response.text();
                    html = typeof replacePlaceholders === 'function' ? replacePlaceholders(html) : html;
                    const container = document.getElementById(containerId);
                    if (container) {
                        container.innerHTML = html;
                        const scripts = container.querySelectorAll('script');
                        scripts.forEach(oldScript => {
                            const newScript = document.createElement('script');
                            Array.from(oldScript.attributes).forEach(attr => {
                                newScript.setAttribute(attr.name, attr.value);
                            });
                            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                            oldScript.parentNode.replaceChild(newScript, oldScript);
                        });
                    }
                } catch (error) {
                    console.error(`Error loading component ${componentPath}:`, error);
                }
            };
            
            await Promise.all([
                loadComponent('header-container', 'components/header.html'),
                loadComponent('footer-container', 'components/footer.html'),
                loadComponent('whatsapp-float-container', 'components/whatsapp-float.html')
            ]);
            // Replace {{key}} in static thank-you content
            if (typeof replacePlaceholdersInNode === 'function') {
                replacePlaceholdersInNode(document.body);
            }
            // Set footer year
            const yearEl = document.getElementById('current-year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>

<style>
main {
    min-height: 60vh;
    padding: var(--spacing-2xl) 0;
    background-color: var(--color-grey-light);
}

.thank-you-card {
    max-width: 600px;
    margin: 0 auto;
    background-color: var(--color-white);
    padding: var(--spacing-2xl);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    text-align: center;
}

.thank-you-icon {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
    color: var(--color-white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    margin: 0 auto var(--spacing-md);
    font-weight: bold;
}

.thank-you-card h1 {
    color: var(--color-primary);
    margin-bottom: var(--spacing-md);
    font-size: var(--font-size-4xl);
}

.thank-you-card p {
    color: var(--color-text-light);
    font-size: var(--font-size-lg);
    margin-bottom: var(--spacing-md);
    line-height: 1.6;
}

.highlight {
    color: var(--color-primary);
    font-weight: 600;
}

.response-info {
    background-color: var(--color-grey-light);
    padding: var(--spacing-md);
    border-radius: var(--radius-md);
    margin: var(--spacing-lg) 0;
    text-align: left;
}

.response-info h3 {
    color: var(--color-text);
    margin-bottom: var(--spacing-sm);
    font-size: var(--font-size-xl);
}

.response-info p {
    color: var(--color-text-light);
    margin-bottom: 0;
    font-size: var(--font-size-base);
}

.action-buttons {
    display: flex;
    gap: var(--spacing-md);
    justify-content: center;
    margin-top: var(--spacing-lg);
    flex-wrap: wrap;
}

@media (max-width: 768px) {
    .thank-you-card {
        padding: var(--spacing-lg);
    }
    
    .thank-you-card h1 {
        font-size: var(--font-size-3xl);
    }
    
    .action-buttons {
        flex-direction: column;
    }
    
    .action-buttons .btn {
        width: 100%;
    }
}
</style>
